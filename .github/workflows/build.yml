name: Build firmware

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build curl xz-utils

      - name: Install pinned Arm GNU Toolchain 13.3.Rel1
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/arm-gnu-toolchain.tar.xz" \
            "https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/13.3.rel1/binrel/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi.tar.xz"
          mkdir -p "$RUNNER_TEMP/arm-gnu-toolchain"
          tar -xJf "$RUNNER_TEMP/arm-gnu-toolchain.tar.xz" \
            --strip-components=1 \
            -C "$RUNNER_TEMP/arm-gnu-toolchain"
          echo "$RUNNER_TEMP/arm-gnu-toolchain/bin" >> "$GITHUB_PATH"

      - name: Verify compiler version
        run: arm-none-eabi-gcc --version | head -n 1 | grep '13.3.1'

      - name: Configure Admin/User test build
        working-directory: firmware-v3
        run: cmake --preset AdminUser-Morse-Test

      - name: Build Admin/User test firmware
        working-directory: firmware-v3
        run: cmake --build --preset AdminUser-Morse-Test

      - name: Configure RX-only build
        working-directory: firmware-v3
        run: cmake --preset AdminUser-Morse-RXOnly

      - name: Build RX-only firmware
        working-directory: firmware-v3
        run: cmake --build --preset AdminUser-Morse-RXOnly

      - name: Upload test build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quansheng-K5V3-AdminUser-Morse-test
          path: firmware-v3/build/AdminUser-Morse-Test/quansheng.AdminUser_Morse_Test_K5v3_K1.bin
          if-no-files-found: error

      - name: Upload RX-only build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quansheng-K5V3-AdminUser-MorseVoice-rxonly
          path: firmware-v3/build/AdminUser-Morse-RXOnly/quansheng.AU_RX_K5v3_K1.bin
          if-no-files-found: error

      - name: Publish RX-only firmware as pre-release (development branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The version is taken from the first heading of CHANGELOG.md,
          # e.g. "## 0.3.5-rxonly-test ...".  Each push updates that release.
          VERSION="$(grep -m1 '^## ' CHANGELOG.md | awk '{print $2}')"
          TAG="v${VERSION}"
          FILE="Quansheng-K5V3-AdminUser-MorseVoice-v${VERSION}.bin"
          cp firmware-v3/build/AdminUser-Morse-RXOnly/quansheng.AU_RX_K5v3_K1.bin "$FILE"
          sha256sum "$FILE" > "$FILE.sha256"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" "$FILE.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$FILE" "$FILE.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "$TAG" \
              --notes "Experimental test build from the pinned Arm GNU Toolchain 13.3.Rel1. Not yet hardware-tested. See CHANGELOG.md and docs/TEST-CHECKLIST.md."
          fi
