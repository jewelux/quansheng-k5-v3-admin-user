name: Build firmware

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build curl xz-utils

      - name: Install pinned Arm GNU Toolchain 13.3.Rel1
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/arm-gnu-toolchain.tar.xz" \
            "https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/13.3.rel1/binrel/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi.tar.xz"
          mkdir -p "$RUNNER_TEMP/arm-gnu-toolchain"
          tar -xJf "$RUNNER_TEMP/arm-gnu-toolchain.tar.xz" \
            --strip-components=1 \
            -C "$RUNNER_TEMP/arm-gnu-toolchain"
          echo "$RUNNER_TEMP/arm-gnu-toolchain/bin" >> "$GITHUB_PATH"

      - name: Verify compiler version
        run: arm-none-eabi-gcc --version | head -n 1 | grep '13.3.1'

      - name: Configure Admin/User test build
        working-directory: firmware-v3
        run: cmake --preset AdminUser-Morse-Test

      - name: Build Admin/User test firmware
        working-directory: firmware-v3
        run: cmake --build --preset AdminUser-Morse-Test

      - name: Configure RX-only build
        working-directory: firmware-v3
        run: cmake --preset AdminUser-Morse-RXOnly

      - name: Build RX-only firmware
        working-directory: firmware-v3
        run: cmake --build --preset AdminUser-Morse-RXOnly

      - name: Upload test build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quansheng-K5V3-AdminUser-Morse-test
          path: firmware-v3/build/AdminUser-Morse-Test/quansheng.AdminUser_Morse_Test_K5v3_K1.bin
          if-no-files-found: error

      - name: Upload RX-only build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quansheng-K5V3-AdminUser-MorseVoice-rxonly
          path: firmware-v3/build/AdminUser-Morse-RXOnly/quansheng.AU_RX_K5v3_K1.bin
          if-no-files-found: error

      - name: Publish RX-only firmware as pre-release (development branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Select the first release heading whose version starts with a
          # digit. Feature headings such as "V3/K1 ..." must not become tags.
          VERSION="$(grep -m1 -E '^## [0-9]' CHANGELOG.md | awk '{print $2}')"
          TAG="v${VERSION}"
          FILE="Quansheng-K5V3-AdminUser-MorseVoice-v${VERSION}.bin"
          SOURCE="online-flasher/${FILE}"
          test -f "$SOURCE"
          cp "$SOURCE" "$FILE"
          sha256sum "$FILE" > "$FILE.sha256"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Releases are immutable unless their published checksum differs
            # from the canonical, tracked online-flasher artifact. This also
            # repairs an asset once if an older workflow replaced it with a
            # newly built binary under the old version number.
            CHECK_DIR="$(mktemp -d)"
            if gh release download "$TAG" \
                 --repo "$GITHUB_REPOSITORY" \
                 --pattern "$FILE.sha256" \
                 --dir "$CHECK_DIR" >/dev/null 2>&1 \
               && cmp -s "$FILE.sha256" "$CHECK_DIR/$FILE.sha256"; then
              echo "Release $TAG already matches the canonical artifact"
            else
              gh release upload "$TAG" "$FILE" "$FILE.sha256" \
                --clobber --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$TAG" "$FILE" "$FILE.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "$TAG" \
              --notes "Experimental test build from the pinned Arm GNU Toolchain 13.3.Rel1. Not yet hardware-tested. See CHANGELOG.md and docs/TEST-CHECKLIST.md."
          fi

      - name: Build K5 V1 Admin/User RX-only firmware
        working-directory: firmware-v1
        run: make -j2 ENABLE_LTO=0 AUTHOR_STRING=DO9RE-LX1WJ VERSION_STRING=v1.01

      - name: Upload K5 V1 packed firmware
        uses: actions/upload-artifact@v4
        with:
          name: Quansheng-K5V1-AdminUser-MorseVoice-rxonly-test
          path: firmware-v1/quansheng.AdminUser_RX_K5v1.packed.bin
          if-no-files-found: error

      - name: Configure experimental V3 Admin/User SAM RX-only build
        working-directory: firmware-v3
        run: cmake --preset AdminUser-SAM-RXOnly

      - name: Build experimental V3 Admin/User SAM RX-only firmware
        working-directory: firmware-v3
        run: cmake --build --preset AdminUser-SAM-RXOnly

      - name: Upload experimental V3 Admin/User SAM artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quansheng-K5V3-AdminUser-SAM-rxonly-experimental
          path: firmware-v3/build/AdminUser-SAM-RXOnly/quansheng.AU_SAM_RX_K5v3_K1.bin
          if-no-files-found: error
