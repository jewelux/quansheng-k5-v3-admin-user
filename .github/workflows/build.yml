name: Build firmware

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain and build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi

      - name: Configure Admin/User test build
        working-directory: firmware-v3
        run: cmake --preset AdminUser-Morse-Test

      - name: Build Admin/User test firmware
        working-directory: firmware-v3
        run: cmake --build --preset AdminUser-Morse-Test

      - name: Configure future RX-only build
        working-directory: firmware-v3
        run: cmake --preset AdminUser-Morse-RXOnly

      - name: Build future RX-only firmware
        working-directory: firmware-v3
        run: cmake --build --preset AdminUser-Morse-RXOnly

      - name: Upload test build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quansheng-K5V3-AdminUser-Morse-test
          path: firmware-v3/build/AdminUser-Morse-Test/quansheng.AdminUser_Morse_Test_K5v3_K1.bin
          if-no-files-found: error
